name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  build:
    name: Build ${{ matrix.firmware.name }}
    needs: test  # Only build if tests pass
    runs-on: ubuntu-latest
    strategy:
      matrix:
        firmware:
          - file: htgdo_v2_4_2_secplus2.yaml
            name: HTGDO v2.4.2 Security+ 2.0
            manifest_filename: htgdo_v2_4_2_secplus2-manifest.json
          - file: htgdo_v2_4_2_secplus1.yaml
            name: HTGDO v2.4.2 Security+ 1.0
            manifest_filename: htgdo_v2_4_2_secplus1-manifest.json
          - file: v32board.yaml
            name: V32 Board Security+ 2.0
            manifest_filename: v32board-manifest.json
          - file: v32board_secplusv1.yaml
            name: V32 Board Security+ 1.0
            manifest_filename: v32board_secplusv1-manifest.json
      fail-fast: false
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Update external_components ref to current branch
        if: github.ref != 'refs/heads/main'
        run: |
          python3 scripts/update_refs_for_ci.py
          echo ""
          echo "Changes made:"
          git diff --color=always
      - name: Build firmware
        uses: ratgdo/esphome-build-action@main
        id: esphome-build
        with:
          yaml-file: ${{ matrix.firmware.file }}
          version: latest
      - name: Copy firmware and manifest
        run: |
          mkdir output
          mv ${{ steps.esphome-build.outputs.name }} output/
          jq -s '{"name": "${{ matrix.firmware.name }}", "new_install_improv_wait_time": 15, "new_install_prompt_erase": true, "version": "${{ steps.esphome-build.outputs.esphome-version }}", "home_assistant_domain": "esphome", "new_install_skip_erase": false, "builds":.}' output/${{ steps.esphome-build.outputs.name }}/manifest.json > output/${{ matrix.firmware.manifest_filename }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.firmware.name }}
          path: output


  consolidate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Consolidate firmwares
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Download built firmwares
        uses: actions/download-artifact@v8
        with:
          path: firmwares
      - name: Copy files
        run: |-
          mkdir output
          cp -R static/* output/
          cp -R firmwares/*/* output/
          mv output/*/*.bin output/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: consolidate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Download built firmwares
        uses: actions/download-artifact@v8
        with:
          path: firmwares

      - name: Prepare release assets
        run: |-
          mkdir release_assets
          find firmwares -name '*ota.bin' -exec cp {} release_assets/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release_assets/**/*
          tag_name: v${{ github.run_number }}
          name: Firmware Release ${{ github.run_number }}
          body: |
            Automated firmware release from commit ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
