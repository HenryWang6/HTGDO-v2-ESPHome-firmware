name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "2026.5.2"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    name: Build HTGDO-v2.2 ${{ matrix.firmware.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware:
          - file: htgdo_v2_2_secplus2.yaml
            name: Security+ 2.0
          - file: htgdo_v2_2_secplus1.yaml
            name: Security+ 1.0
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use checkout-local packages
        run: |
          python3 scripts/update_refs_for_ci.py
          git diff --color=always

      - name: Build firmware
        uses: ratgdo/esphome-build-action@69cd483b363e218e220cd805ee2fe8a5324c6f77
        with:
          yaml-file: ${{ matrix.firmware.file }}
          version: ${{ env.ESPHOME_VERSION }}
