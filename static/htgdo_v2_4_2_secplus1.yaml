---
substitutions:
  id_prefix: htgdov242
  friendly_name: "HTGDO v2.4.2"
  ratgdo_protocol: secplusv1
  uart_tx_pin: GPIO17
  uart_rx_pin: GPIO21
  status_door_pin: GPIO26
  status_obstruction_pin: GPIO25

web_server:
  local: true

esphome:
  name: garage-door
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.4.0
  project:
    name: htgdo.v2_4_2_secplus1
    version: "2.4.2"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

dashboard_import:
  package_import_url: github://HenryWang6/HTGDO-v2-ESPHome-firmware/htgdo_v2_4_2_secplus1.yaml@main

packages:
  remote_package:
    url: https://github.com/HenryWang6/HTGDO-v2-ESPHome-firmware
    ref: main
    files: [base_htgdo.yaml]
    refresh: 1s
  # remote_package: !include
  #   file: base_htgdo.yaml

switch:
  - platform: ratgdo
    id: ${id_prefix}_led
    type: led
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    name: "LED"
    entity_category: config

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s

time:
  - platform: homeassistant
    id: homeassistant_time

api:
  id: api_server

improv_serial:

esp32_improv:
  authorizer: none

wifi:
  ap:
    ssid: "HTGDO Setup"

captive_portal:

logger:
