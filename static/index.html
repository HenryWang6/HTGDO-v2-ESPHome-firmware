<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>HTGDO-v2 ESPHome Installer</title>
  <meta name="description" content="Install HTGDO-v2 ESPHome firmware." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta property="og:title" content="HTGDO-v2 ESPHome Installer" />
  <meta property="og:site_name" content="HTGDO-v2 ESPHome" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Install HTGDO-v2 ESPHome firmware." />
  <meta property="og:image" content="./header.png" />

  <style>
    :root {
      --accent: #0f766e;
      --border: #ccd6d1;
      --muted: #5c6864;
      --surface: #f7faf8;
      --text: #18211e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #5eead4;
        --border: #34413d;
        --muted: #aab7b2;
        --surface: #101714;
        --text: #edf7f3;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--surface);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 32px;
    }

    .hero {
      display: block;
      width: 100%;
      aspect-ratio: 1200 / 675;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    h1 {
      margin: 22px 0 4px;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .lede,
    .status {
      color: var(--muted);
      font-size: 1rem;
    }

    .protocols {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 24px 0;
    }

    .protocol {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 112px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .protocol:has(input:checked) {
      border-color: var(--accent);
      outline: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .protocol img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
    }

    .protocol input {
      margin: 0 8px 0 0;
      accent-color: var(--accent);
    }

    .protocol strong {
      display: block;
      font-size: 1rem;
    }

    .protocol span {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 8px 0 16px;
    }

    .download {
      color: var(--accent);
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      .protocols {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script type="module" src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js?module"></script>
</head>

<body>
  <main>
    <img class="hero" src="./header.png" alt="HTGDO-v2 ESPHome" />

    <h1>HTGDO-v2</h1>
    <p class="lede">ESPHome firmware for ESP32 Security+ garage door openers.</p>

    <section class="protocols" aria-label="Protocol">
      <label class="protocol">
        <img src="./yellow_learn_button.jpg" alt="Yellow learn button" />
        <span>
          <input type="radio" name="protocol" value="secplus2" checked />
          <strong>Security+ 2.0</strong>
          <span>Yellow learn button</span>
        </span>
      </label>

      <label class="protocol">
        <img src="./purple_learn_button.jpg" alt="Purple, orange, red, or brown learn button" />
        <span>
          <input type="radio" name="protocol" value="secplus1" />
          <strong>Security+ 1.0</strong>
          <span>Purple, orange, red, or brown learn button</span>
        </span>
      </label>
    </section>

    <div class="actions">
      <esp-web-install-button id="install-button" manifest="htgdo-v2-secplus2-manifest.json"></esp-web-install-button>
      <a id="download-ota" class="download hidden" href="">OTA firmware</a>
    </div>

    <p id="status" class="status">Selected: Security+ 2.0</p>

    <footer>
      Source and release binaries are published from the HTGDO-v2 ESPHome firmware repo.
    </footer>
  </main>

  <script>
    const firmwares = {
      secplus2: {
        label: "Security+ 2.0",
        manifest: "htgdo-v2-secplus2-manifest.json",
      },
      secplus1: {
        label: "Security+ 1.0",
        manifest: "htgdo-v2-secplus1-manifest.json",
      },
    };

    const installButton = document.querySelector("#install-button");
    const downloadOta = document.querySelector("#download-ota");
    const statusText = document.querySelector("#status");

    async function refreshFirmware(protocol) {
      const firmware = firmwares[protocol];
      installButton.manifest = firmware.manifest;
      statusText.textContent = `Selected: ${firmware.label}`;
      downloadOta.classList.add("hidden");
      downloadOta.removeAttribute("href");

      try {
        const response = await fetch(firmware.manifest, { cache: "no-store" });
        const manifest = await response.json();
        const otaPath = manifest?.builds?.[0]?.ota?.path;
        if (otaPath) {
          downloadOta.href = otaPath;
          downloadOta.classList.remove("hidden");
        }
      } catch (_error) {
        statusText.textContent = `Selected: ${firmware.label}`;
      }
    }

    document.querySelectorAll('input[name="protocol"]').forEach((input) => {
      input.addEventListener("change", (event) => {
        refreshFirmware(event.target.value);
      });
    });

    refreshFirmware("secplus2");
  </script>
</body>

</html>
